<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANG AUTO PRO - PREMIUM CRM</title>

<link rel="apple-touch-icon" href="https://i.ibb.co/Z6f1Nb9H/image.png">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.min.js"></script>

<style>

:root{
--primary:#2563eb;
--accent:#0ea5e9;
--accent-gradient:linear-gradient(135deg,#0ea5e9,#3b82f6);
--gold-gradient:linear-gradient(135deg,#fbbf24,#f59e0b);
--green-gradient:linear-gradient(135deg,#34d399,#10b981);
--purple-gradient:linear-gradient(135deg,#c084fc,#9333ea);
--bg:#f0f4f8;
--card:#ffffff;
--border:#e2e8f0;
--text-main:#1e293b;
--text-dim:#64748b;
--danger:#ef4444;
--warning:#f59e0b;
--success:#10b981;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
background:var(--bg);
color:var(--text-main);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
margin:0;
padding-bottom:90px
}

.card.urgent{
border-left:4px solid #ef4444;
background:#fff5f5
}

#login-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(240,244,248,.9);
backdrop-filter:blur(15px);
display:flex;
align-items:center;
justify-content:center;
z-index:9999
}

.login-box{
background:white;
padding:40px 30px;
border-radius:20px;
border:1px solid var(--border);
width:90%;
max-width:360px;
text-align:center
}

.login-box h2{
margin:0 0 10px 0;
background:var(--accent-gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.login-box input{
text-align:center;
font-size:18px;
letter-spacing:5px;
background:#f8fafc;
border:2px solid var(--border)
}

.header{
background:white;
padding:20px;
text-align:center;
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:100
}

.header h1{
font-size:18px;
margin:0;
background:var(--accent-gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.container{
max-width:600px;
margin:auto;
padding:15px
}

.tab-content{
display:none
}

.tab-content.active{
display:block
}

.section-title{
font-size:12px;
font-weight:800;
color:var(--primary);
margin:25px 0 10px 5px
}

.card{
background:white;
border:1px solid var(--border);
border-radius:16px;
padding:18px;
margin-bottom:15px
}

input,textarea,select{
width:100%;
background:#f8fafc;
border:1px solid var(--border);
padding:14px;
border-radius:10px;
margin-bottom:15px
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer
}

.btn-main{
background:var(--accent-gradient);
color:white
}

.btn-check{
background:#f0f9ff;
color:#0284c7;
border:1px solid #bae6fd
}

.btn-success{
background:var(--green-gradient);
color:white
}

.btn-danger{
background:#fef2f2;
color:var(--danger);
border:1px solid #fecaca
}

.bottom-nav{
position:fixed;
bottom:0;
width:100%;
background:white;
border-top:1px solid var(--border);
display:flex;
height:80px
}

.nav-item{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:10px;
color:#64748b;
text-decoration:none
}

.nav-item.active{
color:var(--primary)
}

.image-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.image-item{
aspect-ratio:1/1;
border-radius:8px;
overflow:hidden
}

.image-item img{
width:100%;
height:100%;
object-fit:cover
}

#toast{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
background:var(--success);
color:white;
padding:12px 24px;
border-radius:20px;
font-weight:700;
display:none;
z-index:999
}

</style>
</head>

<body>

<div id="login-screen">
<div class="login-box">
<h2>SANG AUTO PRO</h2>
<p>Hệ thống CRM</p>
<input type="password" id="access-key">
<button class="btn btn-main" onclick="verifyAccess()">MỞ KHÓA</button>
</div>
</div>

<div id="app-content" style="display:none">

<div id="toast">Đã lưu</div>

<div class="header">
<h1>SANG AUTO PRO CRM</h1>
</div>

<div class="container">

<div id="tab-input" class="tab-content active">

<h2 class="section-title">Thông tin khách</h2>

<div class="card">

<select id="form-type" onchange="toggleFormFields()">
<option value="mua">Khách cần mua xe</option>
<option value="ban">Khách cần bán xe</option>
</select>

<input id="cus-name" placeholder="Tên khách">

<input id="cus-phone" placeholder="SĐT">

<input id="cus-car" placeholder="Loại xe">

<input id="cus-year-color" placeholder="Đời xe / màu">

<div id="field-finance-mua">
<input id="cus-finance-mua" placeholder="Tài chính">
</div>

<div id="field-finance-ban" style="display:none">
<select id="cus-finance-ban">
<option>Không vay</option>
<option>Đang vay</option>
</select>
</div>

<select id="cus-tag">
<option value="nong">Nóng</option>
<option value="am">Ấm</option>
<option value="nguoi">Nguội</option>
</select>

<textarea id="cus-detail" placeholder="Ghi chú"></textarea>

<div id="field-images" style="display:none">
<input type="file" id="cus-images" multiple onchange="handleImagePreview(this)">
<div class="image-grid" id="preview-grid"></div>
</div>

<button class="btn btn-main" id="btn-save" onclick="saveCustomer()">LƯU KHÁCH</button>

</div>

</div>

<div id="tab-buyers" class="tab-content">
<input id="search-buyer" oninput="renderList('mua')" placeholder="Tìm khách mua">
<div id="list-buyers"></div>
</div>

<div id="tab-sellers" class="tab-content">
<input id="search-seller" oninput="renderList('ban')" placeholder="Tìm khách bán">
<div id="list-sellers"></div>
</div>

<div id="tab-closed" class="tab-content">
<input id="search-closed" oninput="renderList('chot')" placeholder="Tìm khách đã chốt">
<div id="list-closed"></div>
</div>

</div>

<div class="bottom-nav">

<a class="nav-item active" onclick="switchTab('input',this)">NHẬP</a>
<a class="nav-item" onclick="switchTab('buyers',this)">MUA</a>
<a class="nav-item" onclick="switchTab('sellers',this)">BÁN</a>
<a class="nav-item" onclick="switchTab('closed',this)">CHỐT</a>

</div>

</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyBVz4zVh8gxmNS4vbx39t0mVP7ZJJqH9T8",
databaseURL:"https://sang-post-auto-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"sang-post-auto"
}

firebase.initializeApp(firebaseConfig)
const db=firebase.database()

const IMGBB_KEY="a4b55574ff83037588382d5f83783ea1"

function verifyAccess(){
if(document.getElementById("access-key").value==="190525"){
sessionStorage.setItem("crm_unlocked","true")
location.reload()
}else{
alert("Sai mã")
}
}

document.addEventListener("DOMContentLoaded",()=>{
if(sessionStorage.getItem("crm_unlocked")){
document.getElementById("login-screen").style.display="none"
document.getElementById("app-content").style.display="block"
}
})

function showToast(msg){
const t=document.getElementById("toast")
t.innerText=msg
t.style.display="block"
setTimeout(()=>t.style.display="none",2000)
}

let allCustomers=[]

function switchTab(id,el){
document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"))
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"))
document.getElementById("tab-"+id).classList.add("active")
el.classList.add("active")
}

function toggleFormFields(){
const isMua=document.getElementById("form-type").value==="mua"
document.getElementById("field-finance-mua").style.display=isMua?"block":"none"
document.getElementById("field-finance-ban").style.display=isMua?"none":"block"
document.getElementById("field-images").style.display=isMua?"none":"block"
}

function handleImagePreview(input){
const grid=document.getElementById("preview-grid")
grid.innerHTML=""
Array.from(input.files).forEach(file=>{
const r=new FileReader()
r.onload=e=>{
grid.innerHTML+=`<div class="image-item"><img src="${e.target.result}"></div>`
}
r.readAsDataURL(file)
})
}

async function uploadImages(files){

let urls=[]

for(let file of files){

const compressed=await imageCompression(file,{maxSizeMB:.5,maxWidthOrHeight:1024})

let fd=new FormData()
fd.append("image",compressed)

let res=await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,{method:"POST",body:fd})

let data=await res.json()

if(data.success) urls.push(data.data.url)

}

return urls
}

async function saveCustomer(){

const name=document.getElementById("cus-name").value.trim()
const phone=document.getElementById("cus-phone").value.trim()

if(!name||!phone){
alert("Nhập tên và SĐT")
return
}

const type=document.getElementById("form-type").value

let imgs=[]

if(type==="ban"){
imgs=await uploadImages(document.getElementById("cus-images").files)
}

let id="cus_"+Date.now()

let data={
id,
type,
status:"active",
name,
phone,
car:document.getElementById("cus-car").value,
year_color:document.getElementById("cus-year-color").value,
finance:type==="mua"?document.getElementById("cus-finance-mua").value:document.getElementById("cus-finance-ban").value,
tag:document.getElementById("cus-tag").value,
details:document.getElementById("cus-detail").value,
images:imgs,
created_at:Date.now(),
last_checked:Date.now()
}

await db.ref("crm_customers/"+id).set(data)

showToast("Đã lưu khách")

location.reload()

}

db.ref("crm_customers").on("value",snap=>{

allCustomers=[]

snap.forEach(c=>{
let v=c.val()
if(!v.id)v.id=c.key
allCustomers.push(v)
})

renderList("mua")
renderList("ban")
renderList("chot")

})

function renderList(tab){

let container=document.getElementById(tab==="mua"?"list-buyers":tab==="ban"?"list-sellers":"list-closed")

let search=document.getElementById(tab==="mua"?"search-buyer":tab==="ban"?"search-seller":"search-closed").value.toLowerCase()

let filtered=allCustomers.filter(c=>tab==="chot"?c.status==="chot":(c.type===tab&&c.status!=="chot"))

if(search) filtered=filtered.filter(c=>(c.name+c.phone+c.car).toLowerCase().includes(search))

let html=""

filtered.reverse().forEach(cus=>{

let limit=cus.tag==="nong"?2:(cus.tag==="am"?7:14)

let urgent=(Date.now()-(cus.last_checked||cus.created_at)>limit*86400000)

html+=`

<div class="card ${urgent?"urgent":""}">

<strong>${cus.name}</strong>

<p>${cus.phone}</p>

<p>${cus.car}</p>

<button class="btn btn-check" onclick="markChecked('${cus.id}')">ĐÃ GỌI</button>

<button class="btn btn-success" onclick="markClosed('${cus.id}')">CHỐT</button>

<button class="btn btn-danger" onclick="deleteCus('${cus.id}')">XÓA</button>

</div>

`

})

container.innerHTML=html||"<p>Trống</p>"

}

function markChecked(id){
db.ref("crm_customers/"+id).update({last_checked:Date.now()})
}

function markClosed(id){
if(confirm("Chốt xe?")){
db.ref("crm_customers/"+id).update({status:"chot"})
}
}

function deleteCus(id){
if(confirm("Xóa khách?")){
db.ref("crm_customers/"+id).remove()
}
}

</script>

</body>
</html>
